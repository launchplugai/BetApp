[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "betapp"
version = "0.2.1"
description = "BetApp - bettor intelligence platform for parlay evaluation and protocol-driven risk analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "alembic>=1.14.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.7",
    "email-validator>=2.2.0",
    "jinja2>=3.1.0",
    "pytest>=8.0.0,<10.0.0",
    "black>=24.0.0",
    "mypy>=1.8.0",
    "ruff>=0.5.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "bcrypt>=4.1.0,<5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests", "tests", "dna-matrix/tests", "auth/tests", "persistence/tests", "alerts/tests", "context/tests", "billing/tests"]
pythonpath = [".", "dna-matrix"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true

[tool.setuptools.packages.find]
where = [".", "dna-matrix"]
include = ["app*", "core*"]
