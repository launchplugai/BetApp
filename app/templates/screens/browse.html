<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNA Bet Engine - Protocol Selection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <style>
    @import url('https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=satoshi@300,400,500,700,900&display=swap');

    :root {
      --neon-red: #ff1744;
      --bg-dark: #050505;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(255, 255, 255, 0.03);
    }

    body {
      background-color: var(--bg-dark);
      color: white;
      font-family: 'Satoshi', sans-serif;
      overflow-x: hidden;
    }

    .font-tanker { font-family: 'Tanker', sans-serif; }

    .text-neon-red {
      color: var(--neon-red);
      text-shadow: 0 0 10px rgba(255, 23, 68, 0.6);
    }

    .border-neon-red {
      border-color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.3), inset 0 0 10px rgba(255, 23, 68, 0.1);
    }

    .glow-bg {
      background: radial-gradient(circle at 50% -20%, rgba(255, 23, 68, 0.15), transparent 60%);
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
    }

    .sport-chip-active {
      border-color: var(--neon-red);
      box-shadow: 0 0 15px rgba(255, 23, 68, 0.3), inset 0 0 10px rgba(255, 23, 68, 0.1);
    }

    .sport-chip-active .sport-logo { filter: brightness(1.2) drop-shadow(0 0 6px rgba(255, 23, 68, 0.6)); }
    .sport-chip-active .sport-icon { color: var(--neon-red); filter: drop-shadow(0 0 5px rgba(255, 23, 68, 0.8)); }
    .sport-chip-active .sport-label { color: white; }

    .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .team-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    .team-logo-sm {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .league-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      opacity: 0.7;
    }

    .source-badge {
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .source-live { background: rgba(0, 200, 83, 0.15); color: #00c853; border: 1px solid rgba(0, 200, 83, 0.3); }
    .source-mock { background: rgba(255, 255, 255, 0.05); color: #666; border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 'neon-red': '#ff1744', 'dark-bg': '#050505', 'card-bg': '#0a0a0a' },
          fontFamily: { tanker: ['Tanker', 'sans-serif'], satoshi: ['Satoshi', 'sans-serif'] }
        }
      }
    }
  </script>
</head>
<body>
  <div class="w-full h-screen flex flex-col relative overflow-hidden">
    <div class="absolute inset-0 grid-bg pointer-events-none z-0"></div>
    <div class="absolute top-0 left-0 right-0 h-[400px] glow-bg pointer-events-none z-0"></div>

    <!-- Header -->
    <header class="shrink-0 pt-14 pb-4 px-6 flex items-center justify-between z-20 sticky top-0 bg-[#050505]/80 backdrop-blur-md border-b border-white/5">
      <button onclick="goBack()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 border border-white/10 active:scale-95 transition-transform">
        <iconify-icon icon="lucide:arrow-left" class="text-xl text-gray-300"></iconify-icon>
      </button>
      <h1 class="font-tanker text-2xl tracking-wide pt-1 text-white">BROWSE GAMES</h1>
      <div class="w-10 flex justify-end items-center gap-2">
        <span id="source-indicator" class="source-badge source-mock">MOCK</span>
        <div id="connection-status" class="w-2 h-2 rounded-full bg-neon-red shadow-[0_0_10px_#ff1744] animate-pulse"></div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto no-scrollbar pb-[100px] z-10">

      <!-- League Selection — Horizontal scroll with logos -->
      <section class="px-6 py-5">
        <div class="flex justify-between items-end mb-4">
          <h2 class="font-tanker text-lg text-gray-400 tracking-wider">SELECT LEAGUE</h2>
          <span id="feed-status" class="text-xs text-neon-red font-bold tracking-widest">LIVE FEED</span>
        </div>

        <div id="sport-grid" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
          <!-- Populated by JS -->
        </div>
      </section>

      <!-- Game Count -->
      <div class="px-6 mb-3 flex justify-between items-center">
        <span id="game-count" class="text-xs text-gray-500 font-medium tracking-wider uppercase"></span>
        <div id="data-source" class="text-xs text-gray-600"></div>
      </div>

      <!-- Games List -->
      <section class="px-6">
        <div id="protocols-list" class="flex flex-col gap-4">
          <div class="glass-panel rounded-2xl p-8 flex items-center justify-center">
            <div class="loading-pulse text-neon-red font-tanker text-xl tracking-wider">SCANNING TARGETS...</div>
          </div>
        </div>
      </section>

      <!-- AI Insight -->
      <section id="ai-insight-section" class="px-6 mt-6 mb-6 hidden">
        <div class="w-full p-px bg-gradient-to-r from-transparent via-neon-red to-transparent opacity-30"></div>
        <div class="py-4 flex items-center justify-between">
           <div>
              <div class="text-xs text-neon-red font-bold tracking-widest mb-1">AI INSIGHT</div>
              <div id="ai-insight-text" class="text-sm text-gray-300">Loading...</div>
           </div>
           <button class="w-8 h-8 rounded-full border border-neon-red flex items-center justify-center">
              <iconify-icon icon="lucide:zap" class="text-neon-red text-sm"></iconify-icon>
           </button>
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <footer class="shrink-0 h-[84px] pb-[34px] px-6 bg-[#050505]/90 backdrop-blur-xl border-t border-white/5 fixed bottom-0 w-full z-30">
      <div class="h-full flex items-center justify-between">
        <button onclick="navigateTo('dashboard')" class="flex flex-col items-center gap-1 w-12 text-gray-500 hover:text-white transition-colors">
          <iconify-icon icon="lucide:home" class="text-2xl"></iconify-icon>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button class="flex flex-col items-center gap-1 w-12 text-neon-red drop-shadow-[0_0_8px_rgba(255,23,68,0.5)]">
          <iconify-icon icon="lucide:search" class="text-2xl"></iconify-icon>
          <span class="text-[10px] font-medium">Bet</span>
        </button>
        <button onclick="navigateTo('builder')" class="flex flex-col items-center gap-1 w-12 text-gray-500 hover:text-white transition-colors">
          <iconify-icon icon="lucide:ticket" class="text-2xl"></iconify-icon>
          <span class="text-[10px] font-medium">Slips</span>
        </button>
        <button class="flex flex-col items-center gap-1 w-12 text-gray-500 hover:text-white transition-colors">
          <iconify-icon icon="lucide:user" class="text-2xl"></iconify-icon>
          <span class="text-[10px] font-medium">Profile</span>
        </button>
      </div>
    </footer>
  </div>

  <script>
    // Use live API first, falls back to mock internally
    const API_BASE = '/api/live';
    let currentLeague = 'nba';
    let protocolsData = [];

    // League config with logos and fallback icons
    const LEAGUE_LOGOS = {
      nba: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/nba.png&w=100&h=100',
      nfl: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/nfl.png&w=100&h=100',
      mlb: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/mlb.png&w=100&h=100',
      nhl: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/nhl.png&w=100&h=100',
      soccer: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/eng.1.png&w=100&h=100',
      mma: 'https://a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/ufc.png&w=100&h=100',
    };

    const LEAGUE_ICONS = {
      nba: 'emojione-monotone:basketball',
      nfl: 'fluent:sport-american-football-24-regular',
      mlb: 'guidance:baseball',
      nhl: 'ph:hockey-light',
      soccer: 'ph:soccer-ball-light',
      mma: 'game-icons:boxing-glove',
    };

    const SPORTS = [
      { id: 'nba', name: 'NBA' },
      { id: 'nfl', name: 'NFL' },
      { id: 'nhl', name: 'NHL' },
      { id: 'mlb', name: 'MLB' },
      { id: 'soccer', name: 'Soccer' },
      { id: 'mma', name: 'MMA' },
    ];

    document.addEventListener('DOMContentLoaded', () => {
      renderSportGrid();
      loadProtocols(currentLeague);
    });

    function renderSportGrid() {
      const grid = document.getElementById('sport-grid');
      grid.innerHTML = SPORTS.map(sport => {
        const isActive = sport.id === currentLeague;
        const logo = LEAGUE_LOGOS[sport.id];
        const icon = LEAGUE_ICONS[sport.id];
        return `
          <button
            onclick="selectLeague('${sport.id}')"
            class="flex-shrink-0 w-[90px] h-[90px] glass-panel rounded-xl flex flex-col items-center justify-center gap-2 relative transition-all ${
              isActive ? 'sport-chip-active' : 'hover:bg-white/5'
            } cursor-pointer"
          >
            ${isActive ? '<div class="absolute top-2 right-2 w-1.5 h-1.5 bg-neon-red rounded-full shadow-[0_0_8px_#ff1744]"></div>' : ''}
            ${logo ? `
              <img src="${logo}" alt="${sport.name}" class="w-8 h-8 object-contain ${isActive ? 'sport-logo' : 'opacity-50'}"
                   onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
              <iconify-icon icon="${icon}" class="text-2xl ${isActive ? 'sport-icon' : 'text-gray-500'}" style="display:none;"></iconify-icon>
            ` : `
              <iconify-icon icon="${icon}" class="text-2xl ${isActive ? 'sport-icon' : 'text-gray-500'}"></iconify-icon>
            `}
            <span class="font-tanker text-sm tracking-wide ${isActive ? 'sport-label text-white' : 'text-gray-500'}">${sport.name}</span>
          </button>
        `;
      }).join('');
    }

    function selectLeague(league) {
      currentLeague = league;
      renderSportGrid();
      loadProtocols(league);
    }

    async function loadProtocols(league) {
      const list = document.getElementById('protocols-list');
      list.innerHTML = `
        <div class="glass-panel rounded-2xl p-8 flex items-center justify-center">
          <div class="loading-pulse text-neon-red font-tanker text-xl tracking-wider">SCANNING ${league.toUpperCase()} TARGETS...</div>
        </div>
      `;

      try {
        const response = await fetch(`${API_BASE}/protocols/available?league=${league}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        protocolsData = data.protocols || [];

        // Update source indicator
        const source = data.source || 'mock';
        const indicator = document.getElementById('source-indicator');
        if (source === 'live') {
          indicator.className = 'source-badge source-live';
          indicator.textContent = 'LIVE';
        } else {
          indicator.className = 'source-badge source-mock';
          indicator.textContent = 'MOCK';
        }

        // Update game count
        document.getElementById('game-count').textContent =
          `${protocolsData.length} ${league.toUpperCase()} GAME${protocolsData.length !== 1 ? 'S' : ''} AVAILABLE`;

        renderProtocols(protocolsData);

        const featured = protocolsData.find(p => p.featured);
        if (featured && featured.aiInsight) showAiInsight(featured.aiInsight);
        else document.getElementById('ai-insight-section').classList.add('hidden');

      } catch (err) {
        console.error('Failed to load protocols:', err);
        list.innerHTML = `
          <div class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-4">
            <div class="text-red-500 font-tanker text-xl tracking-wider">CONNECTION FAILED</div>
            <div class="text-gray-500 text-sm">${err.message}</div>
            <button onclick="loadProtocols('${league}')" class="px-4 py-2 bg-neon-red rounded text-white font-bold">RETRY</button>
          </div>
        `;
      }
    }

    function renderProtocols(protocols) {
      const list = document.getElementById('protocols-list');

      if (protocols.length === 0) {
        list.innerHTML = `
          <div class="glass-panel rounded-2xl p-8 flex flex-col items-center justify-center gap-3">
            <iconify-icon icon="lucide:calendar-off" class="text-4xl text-gray-600"></iconify-icon>
            <div class="text-gray-500 font-tanker text-xl tracking-wider">NO GAMES AVAILABLE</div>
            <div class="text-gray-600 text-sm">Check back later for upcoming ${currentLeague.toUpperCase()} games</div>
          </div>
        `;
        return;
      }

      list.innerHTML = protocols.map(protocol => renderProtocolCard(protocol)).join('');
    }

    function teamLogoHtml(logoUrl, teamName, size = 'normal') {
      const cls = size === 'small' ? 'team-logo-sm' : 'team-logo';
      if (logoUrl) {
        return `<img src="${logoUrl}" alt="${teamName}" class="${cls}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 items-center justify-center text-gray-400 font-tanker text-lg" style="display:none;">${teamName.slice(0,3).toUpperCase()}</div>`;
      }
      return `<div class="w-12 h-12 rounded-full bg-gray-800 border border-gray-700 flex items-center justify-center text-gray-400 font-tanker text-lg">${teamName.slice(0,3).toUpperCase()}</div>`;
    }

    function renderProtocolCard(protocol) {
      const isLive = protocol.status === 'LIVE';
      const isFeatured = protocol.featured;
      const [homeTeam, awayTeam] = protocol.teams;
      const score = protocol.score;
      const homeLogo = protocol.homeLogo || '';
      const awayLogo = protocol.awayLogo || '';
      const leagueLogo = protocol.leagueLogo || '';
      const leagueIcon = LEAGUE_ICONS[protocol.league?.toLowerCase()] || 'lucide:trophy';
      const odds = protocol.odds || {};
      const startTime = protocol.startTime ? formatGameTime(protocol.startTime) : '';

      return `
        <div class="glass-panel rounded-2xl p-5 relative overflow-hidden ${isFeatured ? 'border-neon-red' : ''}">
          <!-- Card Header -->
          <div class="flex justify-between items-center mb-5">
            <div class="flex items-center gap-2 text-xs text-gray-400 font-medium tracking-wide uppercase">
              ${leagueLogo ?
                `<img src="${leagueLogo}" alt="${protocol.league}" class="league-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                 <iconify-icon icon="${leagueIcon}" class="text-base" style="display:none;"></iconify-icon>` :
                `<iconify-icon icon="${leagueIcon}" class="text-base"></iconify-icon>`
              }
              <span>${protocol.league}</span>
              ${!isLive && startTime ? `<span class="text-gray-600">• ${startTime}</span>` : ''}
            </div>
            ${isLive ? `
              <div class="flex items-center gap-2 bg-neon-red/10 px-2.5 py-1 rounded-full border border-neon-red/30">
                <div class="w-1.5 h-1.5 bg-neon-red rounded-full animate-pulse"></div>
                <span class="text-neon-red text-xs font-bold tracking-wider">${protocol.clock || 'LIVE'}</span>
              </div>
            ` : `
              <div class="flex items-center gap-1.5 text-xs text-gray-500">
                <iconify-icon icon="lucide:clock" class="text-sm"></iconify-icon>
                <span>Upcoming</span>
              </div>
            `}
          </div>

          <!-- Teams Matchup with Logos -->
          <div class="flex items-center justify-between mb-5">
            <!-- Home Team -->
            <div class="flex flex-col items-center gap-2 flex-1">
              ${teamLogoHtml(homeLogo, homeTeam)}
              <span class="font-tanker text-lg leading-none text-white text-center">${homeTeam.toUpperCase()}</span>
              <span class="text-[10px] text-gray-600 uppercase tracking-widest">Home</span>
              ${score ? `<span class="font-tanker text-2xl text-white">${score.home}</span>` : ''}
            </div>

            <!-- VS / Score divider -->
            <div class="flex flex-col items-center px-4">
              ${score ? `
                <span class="text-xs text-gray-700 font-bold">VS</span>
              ` : `
                <div class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
                  <span class="text-xs text-gray-500 font-bold">VS</span>
                </div>
              `}
            </div>

            <!-- Away Team -->
            <div class="flex flex-col items-center gap-2 flex-1">
              ${teamLogoHtml(awayLogo, awayTeam)}
              <span class="font-tanker text-lg leading-none text-gray-300 text-center">${awayTeam.toUpperCase()}</span>
              <span class="text-[10px] text-gray-600 uppercase tracking-widest">Away</span>
              ${score ? `<span class="font-tanker text-2xl text-gray-400">${score.away}</span>` : ''}
            </div>
          </div>

          <!-- Odds Preview -->
          ${Object.keys(odds).length > 0 ? `
          <div class="grid grid-cols-3 gap-2 mb-4">
            ${odds.spread ? `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 px-1 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold mb-1">Spread</span>
                <span class="text-sm font-bold text-white">${odds.spread.home?.line > 0 ? '+' : ''}${odds.spread.home?.line || '—'}</span>
                <span class="text-[10px] text-gray-500">${odds.spread.home?.odds || ''}</span>
              </div>
            ` : `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold">Spread</span>
                <span class="text-sm font-bold text-white">—</span>
              </div>
            `}
            ${odds.total ? `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 px-1 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold mb-1">Total</span>
                <span class="text-sm font-bold text-white">${odds.total.over?.line || '—'}</span>
                <span class="text-[10px] text-gray-500">O/U</span>
              </div>
            ` : `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold">Total</span>
                <span class="text-sm font-bold text-white">—</span>
              </div>
            `}
            ${odds.moneyline ? `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 px-1 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold mb-1">ML</span>
                <span class="text-sm font-bold text-white">${odds.moneyline.home?.odds > 0 ? '+' : ''}${odds.moneyline.home?.odds || '—'}</span>
                <span class="text-[10px] text-gray-500">${odds.moneyline.away?.odds > 0 ? '+' : ''}${odds.moneyline.away?.odds || ''}</span>
              </div>
            ` : `
              <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
                <span class="text-[10px] text-gray-500 uppercase font-bold">ML</span>
                <span class="text-sm font-bold text-white">—</span>
              </div>
            `}
          </div>
          ` : `
          <div class="grid grid-cols-3 gap-2 mb-4">
            <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
              <span class="text-[10px] text-gray-500 uppercase font-bold">Spread</span>
              <span class="text-sm font-bold text-white">Available</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
              <span class="text-[10px] text-gray-500 uppercase font-bold">Total</span>
              <span class="text-sm font-bold text-white">Available</span>
            </div>
            <div class="bg-white/5 border border-white/10 rounded-lg py-2 flex flex-col items-center">
              <span class="text-[10px] text-gray-500 uppercase font-bold">Props</span>
              <span class="text-sm font-bold text-white">${(protocol.marketsAvailable || []).includes('player_props') ? 'Live' : '—'}</span>
            </div>
          </div>
          `}

          <!-- CTA -->
          <button
            onclick="selectProtocol('${protocol.protocolId}')"
            class="w-full py-3 ${isFeatured ? 'bg-gradient-to-r from-neon-red to-rose-600 text-white border-white/20 shadow-[0_0_15px_rgba(255,23,68,0.4)]' : 'bg-white/5 text-gray-300 hover:text-white border-white/10 hover:border-white/30'} font-tanker text-lg tracking-wider rounded-lg border active:scale-[0.98] transition-all flex items-center justify-center gap-2"
          >
            <span>ANALYZE THIS GAME</span>
            <iconify-icon icon="lucide:arrow-right" class="text-lg"></iconify-icon>
          </button>
        </div>
      `;
    }

    function formatGameTime(isoString) {
      try {
        const d = new Date(isoString);
        const now = new Date();
        const diffMs = d - now;
        const diffHrs = Math.floor(diffMs / 3600000);
        const diffMins = Math.floor((diffMs % 3600000) / 60000);

        if (diffMs < 0) return 'Started';
        if (diffHrs < 1) return `${diffMins}m`;
        if (diffHrs < 24) return `${diffHrs}h ${diffMins}m`;

        return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      } catch { return ''; }
    }

    function showAiInsight(text) {
      const section = document.getElementById('ai-insight-section');
      document.getElementById('ai-insight-text').innerHTML = text;
      section.classList.remove('hidden');
    }

    function selectProtocol(protocolId) {
      const protocol = protocolsData.find(p => p.protocolId === protocolId);
      if (!protocol) return;

      sessionStorage.setItem('dna_protocol_context', JSON.stringify(protocol));
      window.location.href = `/new?screen=builder&protocolId=${protocolId}`;
    }

    function navigateTo(screen) {
      window.location.href = `/app?screen=${screen}`;
    }

    function goBack() {
      window.history.back();
    }
  </script>
</body>
</html>
