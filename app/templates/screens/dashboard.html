<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Bet Engine Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-red: #ff1744;
            --bg-dark: #050505;
            --card-bg: #0f0f0f;
        }
        body { background-color: var(--bg-dark); color: #ffffff; }
        .font-tanker { font-family: 'Tanker', sans-serif; }
        .font-satoshi { font-family: 'Satoshi', sans-serif; }
        .neon-text-glow { text-shadow: 0 0 15px rgba(255, 23, 68, 0.6); }
        .neon-border-glow {
            border: 1px solid rgba(255, 23, 68, 0.4);
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.15), inset 0 0 20px rgba(255, 23, 68, 0.05);
        }
        .neon-btn {
            background: linear-gradient(90deg, #d50000 0%, #ff1744 100%);
            box-shadow: 0 0 25px rgba(255, 23, 68, 0.4);
            transition: all 0.3s ease;
        }
        .neon-btn:active { transform: scale(0.98); box-shadow: 0 0 10px rgba(255, 23, 68, 0.2); }
        .bg-grid-pattern {
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .team-logo-sm { width: 28px; height: 28px; object-fit: contain; }
        .league-logo-sm { width: 20px; height: 20px; object-fit: contain; opacity: 0.6; }
    </style>
</head>
<body>
    <div class="w-full min-h-screen bg-[#050505] font-satoshi flex flex-col relative overflow-hidden bg-grid-pattern">

        <!-- Ambient Red Glow -->
        <div class="absolute top-[-10%] right-[-10%] w-[300px] h-[300px] bg-[#ff1744] rounded-full blur-[120px] opacity-20 pointer-events-none"></div>

        <!-- Header -->
        <header class="pt-14 pb-2 px-6 flex justify-between items-center z-10 shrink-0">
            <div class="flex flex-col">
                <span class="text-xs tracking-widest text-gray-500 uppercase font-bold">DNA Engine</span>
                <h1 class="font-tanker text-2xl tracking-wide leading-none">DASHBOARD</h1>
            </div>
            <div class="flex items-center gap-4">
                <button class="relative p-2 rounded-full hover:bg-white/5 transition-colors">
                    <iconify-icon icon="lucide:bell" class="text-xl text-gray-300"></iconify-icon>
                    <span class="absolute top-2 right-2 w-2 h-2 bg-[#ff1744] rounded-full shadow-[0_0_8px_#ff1744]"></span>
                </button>
                <div class="w-10 h-10 rounded-full border border-gray-700 bg-gray-800 overflow-hidden flex items-center justify-center">
                    <span id="user-avatar" class="font-tanker text-lg text-gray-400">?</span>
                </div>
            </div>
        </header>

        <!-- Main Scroll Area -->
        <main class="flex-1 overflow-y-auto px-6 pb-32 z-10 no-scrollbar">

            <!-- Account Overview -->
            <section class="mt-6">
                <div class="flex items-baseline gap-2 mb-1">
                    <span class="text-gray-400 text-sm font-medium">Total Balance</span>
                    <span id="user-tier" class="px-2 py-0.5 rounded text-[10px] font-bold bg-[#ff1744]/10 text-[#ff1744] border border-[#ff1744]/20 uppercase tracking-wider">Pro</span>
                </div>
                <div class="flex items-center justify-between">
                    <h2 class="font-tanker text-[42px] leading-none text-white"><span id="user-balance">$0.00</span></h2>
                    <div class="flex flex-col items-end">
                        <span id="user-name" class="text-white text-sm font-bold">Loading...</span>
                    </div>
                </div>
            </section>

            <!-- Primary CTA -->
            <button class="w-full mt-8 h-14 neon-btn rounded-xl flex items-center justify-center gap-3 group relative overflow-hidden cursor-pointer" onclick="window.location.href='/app?screen=browse'">
                <div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 pointer-events-none"></div>
                <iconify-icon icon="lucide:plus" class="text-xl font-bold"></iconify-icon>
                <span class="font-tanker text-xl tracking-wide pt-1">START NEW BET PROTOCOL</span>
            </button>

            <!-- Quick Stats Grid -->
            <div class="grid grid-cols-2 gap-4 mt-8">
                <div class="glass-panel p-4 rounded-xl flex flex-col justify-between h-28 relative overflow-hidden">
                    <div class="absolute -bottom-4 -right-4 text-gray-800 opacity-20 transform rotate-12">
                        <iconify-icon icon="lucide:trophy" width="80"></iconify-icon>
                    </div>
                    <span class="text-gray-400 text-xs uppercase tracking-wider font-bold">Win Rate</span>
                    <div>
                        <span id="stat-win-rate" class="font-tanker text-3xl text-white">-</span>
                        <span class="font-tanker text-lg text-[#ff1744]">%</span>
                    </div>
                </div>
                <div class="glass-panel p-4 rounded-xl flex flex-col justify-between h-28 relative overflow-hidden">
                    <div class="absolute -bottom-4 -right-4 text-gray-800 opacity-20 transform rotate-12">
                        <iconify-icon icon="lucide:layers" width="80"></iconify-icon>
                    </div>
                    <span class="text-gray-400 text-xs uppercase tracking-wider font-bold">Total Parlays</span>
                    <div>
                        <span id="stat-total" class="font-tanker text-3xl text-white">-</span>
                        <span class="text-xs text-gray-500 font-medium ml-1">Lifetime</span>
                    </div>
                </div>
            </div>

            <!-- Live Games Ticker -->
            <section class="mt-8">
                <div class="flex justify-between items-end mb-4">
                    <h3 class="font-tanker text-xl tracking-wide flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#ff1744] animate-pulse shadow-[0_0_10px_#ff1744]"></span>
                        TODAY'S GAMES
                    </h3>
                    <a href="/app?screen=browse" class="text-xs text-[#ff1744] hover:text-white transition-colors uppercase tracking-wider font-bold">Browse All</a>
                </div>

                <div id="live-games-scroll" class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
                    <!-- Populated by JS -->
                    <div class="glass-panel rounded-xl p-4 min-w-[200px] flex items-center justify-center">
                        <span class="text-gray-600 text-sm">Loading games...</span>
                    </div>
                </div>
            </section>

            <!-- Active Protocols Section -->
            <section class="mt-10">
                <div class="flex justify-between items-end mb-5">
                    <h3 class="font-tanker text-2xl tracking-wide flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-[#ff1744] animate-pulse shadow-[0_0_10px_#ff1744]"></span>
                        ACTIVE PROTOCOLS
                    </h3>
                    <a href="#" class="text-xs text-gray-500 hover:text-white transition-colors uppercase tracking-wider font-bold">View All</a>
                </div>

                <div id="active-protocols-list">
                    <!-- Populated by JS -->
                </div>
            </section>

            <div class="h-8"></div>
        </main>

        <!-- Bottom Navigation -->
        <nav class="fixed bottom-0 left-0 w-full pb-[34px] pt-4 bg-[#050505]/95 backdrop-blur-md border-t border-white/5" style="z-index: 9999;">
            <div class="flex justify-around items-center px-4 pointer-events-auto">
                <a href="/app?screen=dashboard" class="flex flex-col items-center gap-1 group pointer-events-auto" style="min-width: 60px;">
                    <div class="relative">
                        <iconify-icon icon="lucide:layout-dashboard" class="text-2xl text-[#ff1744] drop-shadow-[0_0_8px_rgba(255,23,68,0.5)]"></iconify-icon>
                        <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1 h-1 bg-[#ff1744] rounded-full"></div>
                    </div>
                    <span class="text-[10px] font-medium text-white">Home</span>
                </a>
                <a href="/app?screen=browse" class="flex flex-col items-center gap-1 group opacity-50 hover:opacity-100 transition-opacity pointer-events-auto" style="min-width: 60px;">
                    <iconify-icon icon="lucide:search" class="text-2xl text-gray-400 group-hover:text-white transition-colors"></iconify-icon>
                    <span class="text-[10px] font-medium text-gray-400 group-hover:text-white transition-colors">Browse</span>
                </a>
                <a href="/app?screen=builder" class="flex flex-col items-center gap-1 group opacity-50 hover:opacity-100 transition-opacity pointer-events-auto" style="min-width: 60px;">
                    <iconify-icon icon="lucide:plus-circle" class="text-2xl text-gray-400 group-hover:text-white transition-colors"></iconify-icon>
                    <span class="text-[10px] font-medium text-gray-400 group-hover:text-white transition-colors">Build</span>
                </a>
                <a href="#" onclick="handleLogout(); return false;" class="flex flex-col items-center gap-1 group opacity-50 hover:opacity-100 transition-opacity pointer-events-auto" style="min-width: 60px;">
                    <iconify-icon icon="lucide:log-out" class="text-2xl text-gray-400 group-hover:text-white transition-colors"></iconify-icon>
                    <span class="text-[10px] font-medium text-gray-400 group-hover:text-white transition-colors">Logout</span>
                </a>
            </div>
        </nav>
    </div>

    <script>
        const token = sessionStorage.getItem('dna_auth_token');
        const user = JSON.parse(sessionStorage.getItem('dna_user') || '{}');

        if (!token) {
            window.location.href = '/app?screen=auth';
        }

        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(amount || 0);
        }

        // Load dashboard data
        async function loadDashboard() {
            try {
                const response = await fetch('/api/dashboard/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 401) {
                    sessionStorage.clear();
                    window.location.href = '/app?screen=auth';
                    return;
                }

                const data = await response.json();

                document.getElementById('user-name').textContent = data.user?.name || 'User';
                document.getElementById('user-avatar').textContent = (data.user?.name || 'U').charAt(0).toUpperCase();
                document.getElementById('user-tier').textContent = data.user?.tier || 'GOOD';
                document.getElementById('user-balance').textContent = formatCurrency(data.user?.balance || 0);
                document.getElementById('stat-win-rate').textContent = data.stats?.win_rate?.toFixed(1) || '0.0';
                document.getElementById('stat-total').textContent = data.stats?.total_bets || 0;

                renderActiveProtocols(data.active_protocols);
            } catch (err) {
                console.error('Dashboard load failed:', err);
                // Still load with defaults
                document.getElementById('user-name').textContent = user.name || 'User';
                document.getElementById('user-avatar').textContent = (user.name || 'U').charAt(0).toUpperCase();
            }
        }

        // Load live games for ticker
        async function loadLiveGames() {
            const container = document.getElementById('live-games-scroll');
            try {
                const resp = await fetch('/api/live/protocols/available?league=nba');
                const data = await resp.json();
                const games = data.protocols || [];

                if (games.length === 0) {
                    container.innerHTML = `
                        <div class="glass-panel rounded-xl p-4 min-w-[240px] flex flex-col items-center justify-center gap-2">
                            <iconify-icon icon="lucide:calendar" class="text-2xl text-gray-600"></iconify-icon>
                            <span class="text-gray-500 text-sm">No games right now</span>
                            <a href="/app?screen=browse" class="text-[#ff1744] text-xs font-bold">Browse all leagues</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = games.slice(0, 8).map(game => {
                    const [home, away] = game.teams;
                    const homeLogo = game.homeLogo || '';
                    const awayLogo = game.awayLogo || '';
                    const isLive = game.status === 'LIVE';
                    const score = game.score;

                    return `
                        <div class="glass-panel rounded-xl p-4 min-w-[220px] flex-shrink-0 cursor-pointer hover:border-white/20 transition-all"
                             onclick="window.location.href='/app?screen=browse'">
                            <div class="flex items-center justify-between mb-3">
                                <div class="flex items-center gap-1.5">
                                    ${isLive ? `
                                        <div class="w-1.5 h-1.5 bg-[#ff1744] rounded-full animate-pulse"></div>
                                        <span class="text-[10px] text-[#ff1744] font-bold tracking-wider">${game.clock || 'LIVE'}</span>
                                    ` : `
                                        <span class="text-[10px] text-gray-500 font-medium">Upcoming</span>
                                    `}
                                </div>
                                <span class="text-[10px] text-gray-600 uppercase">${game.league}</span>
                            </div>

                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-2">
                                    ${homeLogo ? `<img src="${homeLogo}" class="team-logo-sm" onerror="this.style.display='none'">` : ''}
                                    <span class="text-sm font-bold text-white">${home}</span>
                                </div>
                                ${score ? `<span class="font-tanker text-lg text-white">${score.home}</span>` : ''}
                            </div>

                            <div class="flex items-center justify-between mt-2">
                                <div class="flex items-center gap-2">
                                    ${awayLogo ? `<img src="${awayLogo}" class="team-logo-sm" onerror="this.style.display='none'">` : ''}
                                    <span class="text-sm font-bold text-gray-400">${away}</span>
                                </div>
                                ${score ? `<span class="font-tanker text-lg text-gray-400">${score.away}</span>` : ''}
                            </div>

                            ${game.odds?.moneyline ? `
                                <div class="flex justify-between mt-3 pt-2 border-t border-white/5">
                                    <span class="text-[10px] text-gray-500">ML</span>
                                    <div class="flex gap-3">
                                        <span class="text-xs font-bold text-white">${game.odds.moneyline.home?.odds > 0 ? '+' : ''}${game.odds.moneyline.home?.odds || ''}</span>
                                        <span class="text-xs font-bold text-gray-400">${game.odds.moneyline.away?.odds > 0 ? '+' : ''}${game.odds.moneyline.away?.odds || ''}</span>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error('Live games load failed:', err);
                container.innerHTML = `
                    <div class="glass-panel rounded-xl p-4 min-w-[200px] flex items-center justify-center">
                        <span class="text-gray-600 text-sm">Could not load games</span>
                    </div>
                `;
            }
        }

        function renderActiveProtocols(protocols) {
            const list = document.getElementById('active-protocols-list');
            if (!protocols || protocols.length === 0) {
                list.innerHTML = `
                    <div class="glass-panel rounded-xl p-8 text-center">
                        <iconify-icon icon="lucide:activity" class="text-4xl text-gray-700 mb-3"></iconify-icon>
                        <p class="text-gray-500 mb-2">No active protocols</p>
                        <a href="/app?screen=browse" class="text-[#ff1744] text-sm font-bold">Start your first bet →</a>
                    </div>
                `;
                return;
            }
        }

        function handleLogout() {
            sessionStorage.clear();
            window.location.href = '/app?screen=auth';
        }

        // Load everything
        loadDashboard();
        loadLiveGames();
    </script>
</body>
</html>
