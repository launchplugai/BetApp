<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
  <link href="https://api.fontshare.com/v2/css?f[]=tanker@400&f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-red: #ff1744;
      --bg-dark: #050505;
    }
    body {
      font-family: 'Satoshi', sans-serif;
      background-color: var(--bg-dark);
      color: #ffffff;
      margin: 0;
      padding: 0;
    }
    .font-tanker {
      font-family: 'Tanker', sans-serif;
    }
    .neon-glow-red {
      text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744, 0 0 50px rgba(255, 23, 68, 0.6);
      animation: neon-pulse 3s infinite alternate;
    }
    @keyframes neon-pulse {
      from { text-shadow: 0 0 15px #ff1744, 0 0 30px #ff1744, 0 0 45px rgba(255, 23, 68, 0.5); }
      to { text-shadow: 0 0 20px #ff1744, 0 0 45px #ff1744, 0 0 65px rgba(255, 23, 68, 0.8); }
    }
    .neon-border-glow {
      box-shadow: 0 0 20px rgba(255, 23, 68, 0.2);
      border: 1px solid rgba(255, 23, 68, 0.5);
    }
    .neon-btn {
      box-shadow: 0 0 25px rgba(255, 23, 68, 0.5), inset 0 0 10px rgba(255, 23, 68, 0.3);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .neon-btn:hover {
        background-color: darkred;
    }

    /* Additional styles for buttons and sections */
    .button {
        padding: 10px 20px;
        background-color: var(--neon-red);
        border: none;
        color: white;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
    }
    .button:hover {
        background-color: darkred;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  <div class="text-center max-w-2xl">
    <h1 class="font-tanker text-6xl md:text-8xl neon-glow-red mb-6">DNA</h1>
    <p class="text-xl md:text-2xl text-gray-300 mb-8">Bet Engine</p>
    <a href="/app" class="neon-btn inline-block px-8 py-4 bg-[#ff1744] text-white font-bold rounded-lg text-lg">
      Launch App
    </a>
  </div>
</body>
</html>
