<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DNA Platform</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            padding: 20px 0;
            border-bottom: 2px solid #ff1744;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: -0.5px;
        }
        
        h1 span {
            color: #ff1744;
            font-weight: 500;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
        }
        
        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        
        .tab:hover {
            color: #fff;
            border-bottom-color: #ff1744;
        }
        
        .tab.active {
            color: #fff;
            border-bottom-color: #ff1744;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
        }
        
        .card h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #fff;
        }
        
        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
        }
        
        .stat:last-child {
            border-bottom: none;
        }
        
        .stat label {
            color: #999;
            font-size: 13px;
        }
        
        .stat value {
            color: #fff;
            font-size: 16px;
            font-weight: 500;
        }
        
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status.healthy {
            background: rgba(76, 175, 80, 0.2);
            color: #4caf50;
        }
        
        .status.degraded {
            background: rgba(255, 152, 0, 0.2);
            color: #ff9800;
        }
        
        .status.down {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
        }
        
        .config-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .form-group label {
            font-size: 13px;
            color: #999;
        }
        
        .form-group input[type="number"],
        .form-group input[type="text"] {
            background: #2a2a2a;
            border: 1px solid #333;
            color: #fff;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #ff1744;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }
        
        button {
            background: #ff1744;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #d50032;
        }
        
        button.secondary {
            background: #333;
        }
        
        button.secondary:hover {
            background: #444;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid #f44336;
            color: #f44336;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .success {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid #4caf50;
            color: #4caf50;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .endpoint-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .endpoint-item {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 4px;
            border-left: 3px solid #ff1744;
        }
        
        .endpoint-item .method {
            font-weight: 600;
            color: #ff1744;
            margin-right: 10px;
        }
        
        .endpoint-item .path {
            color: #fff;
            font-family: 'Courier New', monospace;
        }
        
        .endpoint-item .desc {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }
        
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><span>DNA</span> Admin Dashboard</h1>
        </div>
    </header>
    
    <div class="container">
        <div id="message-area"></div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('overview')">Overview</button>
            <button class="tab" onclick="switchTab('config')">Configuration</button>
            <button class="tab" onclick="switchTab('api')">API Management</button>
            <button class="tab" onclick="switchTab('nba')">NBA Analytics</button>
            <button class="tab" onclick="switchTab('reports')">Reports</button>
        </div>
        
        <!-- Overview Tab -->
        <div id="overview" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <h3>System Health</h3>
                    <div id="health-status" class="loading">Loading...</div>
                </div>
                
                <div class="card">
                    <h3>Performance</h3>
                    <div id="performance-stats" class="loading">Loading...</div>
                </div>
                
                <div class="card">
                    <h3>NBA Analytics</h3>
                    <div id="nba-stats" class="loading">Loading...</div>
                </div>
            </div>
        </div>
        
        <!-- Configuration Tab -->
        <div id="config" class="tab-content">
            <div class="grid">
                <div class="card">
                    <h3>NBA Configuration</h3>
                    <div id="config-form" class="config-form"></div>
                </div>
                
                <div class="card">
                    <h3>Feature Flags</h3>
                    <div id="feature-flags"></div>
                </div>
            </div>
        </div>
        
        <!-- API Management Tab -->
        <div id="api" class="tab-content">
            <div class="card">
                <h3>API Endpoints</h3>
                <div id="endpoint-list" class="endpoint-list loading">Loading...</div>
            </div>
            
            <div class="grid" style="margin-top: 20px;">
                <div class="card">
                    <h3>Cache Management</h3>
                    <div class="button-group">
                        <button onclick="clearCache()">Clear All Cache</button>
                        <button class="secondary" onclick="clearExpiredCache()">Clear Expired</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- NBA Analytics Tab -->
        <div id="nba" class="tab-content">
            <div class="grid">
                <div class="card">
                    <h3>Data Sync</h3>
                    <div class="button-group">
                        <button onclick="syncTeams()">Sync Teams</button>
                        <button onclick="syncPlayers()">Sync Players</button>
                    </div>
                </div>
                
                <div class="card">
                    <h3>Data Sources</h3>
                    <div class="button-group">
                        <button onclick="scrapeInjuries()">Scrape Injuries</button>
                        <button onclick="runETL()">Run ETL</button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Reports Tab -->
        <div id="reports" class="tab-content">
            <div class="card">
                <h3>Super Report</h3>
                <button onclick="generateReport()">Generate Full Report</button>
                <div id="full-report" style="margin-top: 20px;"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentConfig = null;
        
        // Tab switching
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
            
            // Load data for active tab
            if (tabName === 'overview') loadOverview();
            if (tabName === 'config') loadConfig();
            if (tabName === 'api') loadEndpoints();
        }
        
        // Load overview data
        async function loadOverview() {
            try {
                const report = await fetch('/api/admin/report/super').then(r => r.json());
                
                // Health status
                const healthHTML = report.health.map(h => `
                    <div class="stat">
                        <label>${h.component}</label>
                        <span class="status ${h.status}">${h.status.toUpperCase()}</span>
                    </div>
                `).join('');
                document.getElementById('health-status').innerHTML = healthHTML;
                
                // Performance stats
                const perfHTML = `
                    <div class="stat">
                        <label>Avg Response Time</label>
                        <value>${report.performance.avg_response_time_ms.toFixed(1)}ms</value>
                    </div>
                    <div class="stat">
                        <label>Cache Hit Rate</label>
                        <value>${report.performance.cache_hit_rate_percent.toFixed(1)}%</value>
                    </div>
                    <div class="stat">
                        <label>Error Rate</label>
                        <value>${report.performance.error_rate_percent.toFixed(2)}%</value>
                    </div>
                `;
                document.getElementById('performance-stats').innerHTML = perfHTML;
                
                // NBA stats
                const nbaHTML = `
                    <div class="stat">
                        <label>Teams Loaded</label>
                        <value>${report.nba.teams_loaded}</value>
                    </div>
                    <div class="stat">
                        <label>Games Today</label>
                        <value>${report.nba.games_today}</value>
                    </div>
                    <div class="stat">
                        <label>Injuries Tracked</label>
                        <value>${report.nba.injuries_tracked}</value>
                    </div>
                `;
                document.getElementById('nba-stats').innerHTML = nbaHTML;
            } catch (error) {
                showMessage('Failed to load overview', 'error');
            }
        }
        
        // Load configuration
        async function loadConfig() {
            try {
                const config = await fetch('/api/admin/config').then(r => r.json());
                currentConfig = config;
                
                const formHTML = `
                    <div class="form-group">
                        <label>Rest Coefficient (B2B)</label>
                        <input type="number" step="0.1" value="${config.nba.rest_coefficient}" id="rest-coeff">
                    </div>
                    <div class="form-group">
                        <label>Tank Detection Threshold</label>
                        <input type="number" step="0.1" min="0" max="1" value="${config.nba.tank_detection_threshold}" id="tank-threshold">
                    </div>
                    <div class="form-group">
                        <label>Cache TTL (seconds)</label>
                        <input type="number" value="${config.nba.cache_ttl_seconds}" id="cache-ttl">
                    </div>
                    <div class="button-group">
                        <button onclick="saveConfig()">Save Changes</button>
                        <button class="secondary" onclick="resetConfig()">Reset to Defaults</button>
                    </div>
                `;
                document.getElementById('config-form').innerHTML = formHTML;
                
                // Feature flags
                const flagsHTML = Object.entries(config.features).map(([key, value]) => `
                    <div class="checkbox-group">
                        <input type="checkbox" ${value ? 'checked' : ''} id="feature-${key}">
                        <label>${key.replace(/_/g, ' ')}</label>
                    </div>
                `).join('');
                document.getElementById('feature-flags').innerHTML = flagsHTML;
            } catch (error) {
                showMessage('Failed to load config', 'error');
            }
        }
        
        // Save configuration
        async function saveConfig() {
            const updates = {
                nba: {
                    rest_coefficient: parseFloat(document.getElementById('rest-coeff').value),
                    tank_detection_threshold: parseFloat(document.getElementById('tank-threshold').value),
                    cache_ttl_seconds: parseInt(document.getElementById('cache-ttl').value)
                }
            };
            
            try {
                await fetch('/api/admin/config/update', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({updates})
                });
                showMessage('Configuration updated successfully', 'success');
            } catch (error) {
                showMessage('Failed to update configuration', 'error');
            }
        }
        
        // Reset configuration
        async function resetConfig() {
            if (!confirm('Reset configuration to defaults?')) return;
            
            try {
                await fetch('/api/admin/config/reset', {method: 'POST'});
                showMessage('Configuration reset to defaults', 'success');
                loadConfig();
            } catch (error) {
                showMessage('Failed to reset configuration', 'error');
            }
        }
        
        // Load API endpoints
        async function loadEndpoints() {
            try {
                const endpoints = await fetch('/api/admin/api/endpoints').then(r => r.json());
                
                const html = Object.entries(endpoints).map(([category, eps]) => `
                    <h4 style="margin-top: 20px; color: #fff;">${category.toUpperCase()}</h4>
                    ${eps.map(ep => `
                        <div class="endpoint-item">
                            <div>
                                <span class="method">${ep.method}</span>
                                <span class="path">${ep.path}</span>
                            </div>
                            <div class="desc">${ep.description}</div>
                        </div>
                    `).join('')}
                `).join('');
                
                document.getElementById('endpoint-list').innerHTML = html;
            } catch (error) {
                showMessage('Failed to load endpoints', 'error');
            }
        }
        
        // Action functions
        async function clearCache() {
            try {
                const result = await fetch('/api/admin/cache/clear', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to clear cache', 'error');
            }
        }
        
        async function clearExpiredCache() {
            try {
                const result = await fetch('/api/admin/cache/clear-expired', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to clear expired cache', 'error');
            }
        }
        
        async function syncTeams() {
            try {
                const result = await fetch('/api/admin/nba/sync-teams', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to sync teams', 'error');
            }
        }
        
        async function syncPlayers() {
            try {
                const result = await fetch('/api/admin/nba/sync-players', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to sync players', 'error');
            }
        }
        
        async function scrapeInjuries() {
            try {
                const result = await fetch('/api/admin/nba/scrape-injuries', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to scrape injuries', 'error');
            }
        }
        
        async function runETL() {
            if (!confirm('Run daily ETL? This may take a few minutes.')) return;
            
            try {
                const result = await fetch('/api/admin/nba/run-etl', {method: 'POST'}).then(r => r.json());
                showMessage(result.message, 'success');
            } catch (error) {
                showMessage('Failed to run ETL', 'error');
            }
        }
        
        async function generateReport() {
            try {
                const report = await fetch('/api/admin/report/super').then(r => r.json());
                document.getElementById('full-report').innerHTML = `<pre>${JSON.stringify(report, null, 2)}</pre>`;
            } catch (error) {
                showMessage('Failed to generate report', 'error');
            }
        }
        
        // Show message
        function showMessage(text, type) {
            const messageArea = document.getElementById('message-area');
            messageArea.innerHTML = `<div class="${type}">${text}</div>`;
            setTimeout(() => messageArea.innerHTML = '', 5000);
        }
        
        // Load initial data
        loadOverview();
    </script>
</body>
</html>
